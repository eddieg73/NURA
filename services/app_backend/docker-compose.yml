services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://brawlerz:${POSTGRES_PASSWORD}@db:5432/brawlerz
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brawlerz
      POSTGRES_USER: brawlerz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - brawlerz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brawlerz -d brawlerz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brawlerz_postgres:

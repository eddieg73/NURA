<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NURA Edge Display</title><style>body{margin:0;background:#061018;color:#d9f7ff;font-family:Arial,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.h{display:flex;justify-content:space-between;border-bottom:1px solid #245269;padding-bottom:10px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.c,.s{background:#0b1d28;border:1px solid #1e5368;border-radius:12px;padding:14px}.l{font-size:12px;opacity:.65;letter-spacing:.1em}.v{font-size:24px;font-weight:800;margin-top:7px}.m{opacity:.7;font-size:13px}.good{color:#6dff9d}.warn{color:#ffd166}.bad{color:#ff6b6b}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="h"><b>NURA OSINT // EDGE DISPLAY</b><span id="status" class="good">● ONLINE</span></div><div class="g"><div class="c"><div class="l">THREAT</div><div id="threat" class="v">--</div><div id="p0" class="m"></div></div><div class="c"><div class="l">SOURCES</div><div id="health" class="v">--</div><div id="sync" class="m"></div></div><div class="c"><div class="l">BRIEF</div><div id="brief" class="v">--</div><div id="conf" class="m"></div></div></div><div class="s"><div class="l">TOP SIGNAL</div><div id="signal" class="v" style="font-size:20px">--</div><div id="meta" class="m"></div></div><div class="s" style="margin-top:10px"><b>WATCH</b> — <span id="watch"></span><br><br><b>PIPELINE</b> — Intake → Triage → Verify → Synthesize → Publish → Archive</div></div><script>function set(d){status.textContent='● '+d.system_status+(d.stale?' / STALE':'');status.className=d.stale?'warn':'good';threat.textContent=d.threat_level;p0.textContent='P0 alerts: '+d.p0_alerts;health.textContent=d.source_health;sync.textContent='Last sync: '+new Date(d.generated_at).toLocaleString();brief.textContent=d.brief_status;conf.textContent='Confidence: '+(d.top_signal?.confidence||'-');signal.textContent=d.top_signal?.title||'No verified signal';meta.textContent=[d.top_signal?.domain,d.top_signal?.priority,d.top_signal?.confidence].filter(Boolean).join(' · ');watch.textContent=(d.watch_domains||[]).join(' · ')}async function load(){try{let r=await fetch('/api/v1/display-state',{cache:'no-store'});if(!r.ok)throw 0;set(await r.json())}catch(e){status.textContent='● API OFFLINE';status.className='bad'}}load();setInterval(load,30000)</script></body></html>

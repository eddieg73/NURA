services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nura_medical}
      POSTGRES_USER: ${POSTGRES_USER:-nura_medical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nura_medical_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nura_medical} -d ${POSTGRES_DB:-nura_medical}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [clinical_private]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nura_medical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nura_medical}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [clinical_private]

networks:
  clinical_private:
    driver: bridge

volumes:
  nura_medical_postgres:

# NURA Radiology AI layer — EXTENDS the existing Clinic stack.
# Does NOT redeclare Orthanc / Mirth / ThaiRIS / OHIF — those already run on Clinic.
# This is only the net-new AI orchestration + registry.

services:
  orchestrator:
    build: ./orchestrator
    container_name: nura-radai-orchestrator
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # Point at the EXISTING Orthanc (canonical radris-stack-orthanc-1) on Clinic.
      ORTHANC_URL: http://radris-stack-orthanc-1:8042
      ORTHANC_USER: nuraadmin
      ORTHANC_PASS: ${ORTHANC_PASSWORD:?set in .env}
      # Point at the EXISTING Mirth engine (MLLP container port 6661 -> host 6663).
      MIRTH_MLLP_HOST: mirth-oie46-mirth-engine-1
      MIRTH_MLLP_PORT: "6661"
    networks:
      - nura-radiology
    # NOTE: attaches to the SAME docker network as the radris/mirth stack on deploy.

  registry-db:
    image: postgres:15
    container_name: nura-radai-registry
    restart: unless-stopped
    environment:
      POSTGRES_USER: nura
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASS:?set in .env}
      POSTGRES_DB: radiology_ai
    volumes:
      - registry-pgdata:/var/lib/postgresql/data
      - ./model-registry/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - nura-radiology

volumes:
  registry-pgdata:

networks:
  nura-radiology:
    name: nura-radiology

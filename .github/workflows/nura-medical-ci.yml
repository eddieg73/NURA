name: NURA Medical CI

on:
  push:
    branches:
      - master
      - feature/nura-medical-*
    paths:
      - 'apps/nura_medical/**'
      - 'services/nura_medical_api/**'
      - '.github/workflows/nura-medical-ci.yml'
  pull_request:
    paths:
      - 'apps/nura_medical/**'
      - 'services/nura_medical_api/**'
      - '.github/workflows/nura-medical-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nura_medical_api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nura_medical_api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run API tests
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-with-more-than-thirty-two-characters
        run: PYTHONPATH=. python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nura_medical
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ios-release-compile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/nura_medical
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare release metadata and privacy manifest
        env:
          BUNDLE_ID: ai.nuratech.nuramedical
          IOS_DEPLOYMENT_TARGET: '15.0'
        run: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          chmod +x scripts/prepare_ios_release.sh
          scripts/prepare_ios_release.sh
      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
      - name: Compile unsigned release app
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=API_BASE_URL=https://api.example.invalid \
            --dart-define=APP_ENVIRONMENT=ci

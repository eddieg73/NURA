workflows:
  nura-medical-app-store-release:
    name: NURA Medical — Reviewer-Enabled App Store Release
    working_directory: apps/nura_medical
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_connect_credentials
        - nura_medical_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      vars:
        BUNDLE_ID: ai.nuratech.nuramedical
        IOS_DEPLOYMENT_TARGET: "15.0"
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: nura-medical-v*
          include: true

    scripts:
      - name: Validate production release variables
        script: |
          set -euo pipefail
          for variable in API_BASE_URL PRIVACY_POLICY_URL TERMS_URL SUPPORT_URL BUNDLE_ID; do
            value="$(eval echo \"\$$variable\")"
            if [ -z "$value" ]; then
              echo "$variable is required" >&2
              exit 1
            fi
          done
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          case "$API_BASE_URL$PRIVACY_POLICY_URL$TERMS_URL$SUPPORT_URL" in
            *example.invalid*|*localhost*|*127.0.0.1*)
              echo "Production URLs cannot use placeholders or loopback hosts" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        script: |
          flutter pub get
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document

      - name: Validate canonical application
        script: |
          dart format --output=none lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build web \
            --target=lib/main_appstore.dart \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="APP_ENVIRONMENT=production"

      - name: Prepare iOS release
        script: |
          chmod +x scripts/prepare_ios_release_v2.sh
          BUNDLE_ID="$BUNDLE_ID" \
          IOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
          scripts/prepare_ios_release_v2.sh

      - name: Install CocoaPods and provisioning profiles
        script: |
          cd ios
          pod install --repo-update
          cd ..
          xcode-project use-profiles

      - name: Build signed App Store IPA
        script: |
          flutter build ipa \
            --target=lib/main_appstore.dart \
            --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="APP_ENVIRONMENT=production" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="TERMS_URL=$TERMS_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL" \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: false
